modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"
issueTrackerURL="${mod_issue_tracker_url}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="${mod_display_url}"
logoFile="${mod_logo_file}"
credits="${mod_credits}"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config = "sophisticateditemactions-refinedstorage.mixins.json"
requiredMods = ["refinedstorage"]

[[dependencies.${mod_id}]]
modId="sophisticatedstorageinmotion"
type="optional"
versionRange="${ssim_version}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="${jei_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ae2"
type="optional"
versionRange="[19.2.8,20)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="refinedstorage"
type="optional"
versionRange="[2.0.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sophisticatedbackpacks"
type="optional"
versionRange="${sb_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
