name: Gradle Cache Probe

on:
  push:
    branches: [cache-probe]

permissions:
  contents: read
  packages: read

jobs:
  measure-cold-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build without a restored cache
        run: ./gradlew build --no-daemon --console=plain

      - name: Report Gradle cache layout
        shell: bash
        run: |
          du -sh "$HOME/.gradle/wrapper" "$HOME/.gradle/caches" || true
          du -sh "$HOME/.gradle/caches"/* 2>/dev/null | sort -h || true
