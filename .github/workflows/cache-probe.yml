name: Gradle Cache Probe

on:
  push:
    branches: [cache-probe]

permissions:
  contents: read
  packages: read

jobs:
  measure-layered-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Restore common Gradle cache
        id: common-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/wrapper
          key: cache-probe-v3-wrapper-${{ runner.os }}-jdk21-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Restore NeoForm runtime cache
        id: neoformruntime-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.gradle/caches/neoformruntime/artifacts
            ~/.gradle/caches/neoformruntime/intermediate_results
          key: cache-probe-v2-neoforge-mc1.21.1-${{ runner.os }}-jdk21-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon --console=plain

      - name: Report Gradle cache layout
        if: always()
        shell: bash
        run: |
          echo "NeoForm assets excluded from the specialized cache"
          du -sh "$HOME/.gradle/wrapper" "$HOME/.gradle/caches" || true
          du -sh "$HOME/.gradle/caches"/* 2>/dev/null | sort -h || true
          du -sh "$HOME/.gradle/caches/neoformruntime"/* 2>/dev/null | sort -h || true

      - name: Save common Gradle cache
        if: steps.common-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/wrapper
          key: ${{ steps.common-cache.outputs.cache-primary-key }}

      - name: Save NeoForm runtime cache
        if: steps.neoformruntime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.gradle/caches/neoformruntime/artifacts
            ~/.gradle/caches/neoformruntime/intermediate_results
          key: ${{ steps.neoformruntime-cache.outputs.cache-primary-key }}
