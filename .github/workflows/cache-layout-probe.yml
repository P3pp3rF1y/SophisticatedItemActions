name: Gradle Cache Layout Probe

on:
  push:
    branches: [cache-probe-120]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: zulu
      - name: Restore Gradle wrapper cache
        id: wrapper-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/wrapper
          key: cache-probe-v1-wrapper-${{ runner.os }}-jdk17-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Restore dependency metadata cache
        id: dependency-metadata-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/caches/modules-2/metadata-2.105
          key: cache-probe-v1-neoforgegradle-dependency-metadata-${{ runner.os }}-jdk17-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Restore NeoForgeGradle cache
        id: forge-gradle-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.gradle/caches/forge_gradle
          key: cache-probe-v1-neoforgegradle-runtime-${{ runner.os }}-jdk17-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Build with Gradle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew build --no-daemon --console=plain
      - name: Report Gradle cache layout
        if: always()
        run: |
          du -sh "$HOME/.gradle/wrapper" "$HOME/.gradle/caches" 2>/dev/null || true
          du -sh "$HOME/.gradle/caches"/* 2>/dev/null | sort -h || true
          du -sh "$HOME/.gradle/caches/modules-2"/* 2>/dev/null | sort -h || true
          du -sh "$HOME/.gradle/caches/forge_gradle"/* 2>/dev/null | sort -h || true
      - name: Save Gradle wrapper cache
        if: always() && steps.wrapper-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/wrapper
          key: cache-probe-v1-wrapper-${{ runner.os }}-jdk17-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Save dependency metadata cache
        if: always() && steps.dependency-metadata-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/caches/modules-2/metadata-2.105
          key: cache-probe-v1-neoforgegradle-dependency-metadata-${{ runner.os }}-jdk17-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Save NeoForgeGradle cache
        if: always() && steps.forge-gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/caches/forge_gradle
          key: cache-probe-v1-neoforgegradle-runtime-${{ runner.os }}-jdk17-${{ hashFiles('**/*.gradle', '**/gradle.properties', '**/gradle/wrapper/gradle-wrapper.properties') }}
